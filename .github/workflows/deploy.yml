name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Untrusted build dependencies must not receive Pages deploy permissions.
permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require reviewed dependency lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing. Generate and review it locally, then commit it before deploying."
            exit 1
          fi
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund
      - name: Check known dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Build Astro for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
